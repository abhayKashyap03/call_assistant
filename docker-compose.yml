services:
  web:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - ./app/backend:/app/app/backend
      - ./run.py:/app/run.py
    env_file:
      - .env
    environment:
      - PYNGROK_CONFIG=/home/app/.config/ngrok/ngrok.yml

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - web
